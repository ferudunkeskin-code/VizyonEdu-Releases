<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>VizyonEdu Mobil</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #f8fafc;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    #shareOverlay{position:fixed;inset:0;z-index:99999;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));animation:shFade .2s ease-out}
    #shareOverlay .sh-sheet{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 34px #0004;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#18324a;animation:shUp .3s cubic-bezier(.2,.8,.2,1)}
    #shareOverlay strong{font-size:1.05rem;color:#174e78}
    #shareOverlay p{margin:0;font-size:.85rem;color:#607285;word-break:break-all}
    #shareOverlay button{border:0;border-radius:12px;min-height:48px;font:700 .95rem system-ui,sans-serif;background:linear-gradient(180deg,#1f5f8f,#174e78);color:#fff}
    #shareOverlay button.sh-secondary{background:#eef4f8;color:#174e78}
    @keyframes shFade{from{opacity:0}to{opacity:1}}
    @keyframes shUp{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbyQMRl__AbxTccropfdMou8lNT6pYzIeEAT1kewkrPZW8BJGPjYi6ZzrXAYoDCHi1U/exec"
    allow="fullscreen; web-share; clipboard-write"
    loading="eager"
    title="VizyonEdu">
  </iframe>
  <script>
    // Apps Script sayfası Google'ın iç iframe'inde çalışır ve web-share iznini alamaz.
    // Paylaşım menüsü bu üst sayfadan açılır; dosya postMessage ile gelir.
    window.addEventListener('message', async function (e) {
      if (!/^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/i.test(e.origin)) return;
      var d = e.data;
      if (!d || d.type !== 'vizyonedu-share' || !d.id) return;
      function reply(payload) {
        try { e.source.postMessage(Object.assign({ id: d.id }, payload), '*'); } catch (err) {}
      }
      reply({ type: 'vizyonedu-share-ack' });
      var name = String(d.fileName || 'paket.vzep').replace(/[^A-Za-z0-9_.\-]+/g, '_').slice(0, 120);
      if (!/\.vzep$/i.test(name)) name += '.vzep';
      var file;
      try { file = new File([d.bytes], name, { type: 'application/octet-stream' }); }
      catch (err) { reply({ type: 'vizyonedu-share-result', ok: false, name: 'FileError', message: String(err) }); return; }
      if (!navigator.share) { reply({ type: 'vizyonedu-share-result', ok: false, why: 'no-share' }); return; }
      if (navigator.canShare && !navigator.canShare({ files: [file] })) {
        reply({ type: 'vizyonedu-share-result', ok: false, why: 'can-not-share-type' }); return;
      }
      // Paylaşım menüsü kullanıcının bu sayfadaki DOĞRUDAN dokunuşunu ister (iç çerçevedeki
      // dokunuş yetmeyebilir); bu yüzden üst sayfada bir "Paylaş" düğmesi gösterilir.
      var old = document.getElementById('shareOverlay'); if (old) old.remove();
      var ov = document.createElement('div');
      ov.id = 'shareOverlay';
      ov.innerHTML = '<div class="sh-sheet"><strong>Paket hazır</strong><p class="sh-name"></p><p class="sh-sub"></p>' +
        '<button type="button" id="shGo">Paylaş (WhatsApp, e-posta…)</button>' +
        '<button type="button" id="shCancel" class="sh-secondary">Vazgeç</button></div>';
      ov.querySelector('.sh-name').textContent = name;
      ov.querySelector('.sh-sub').textContent = String(d.text || '');
      document.body.appendChild(ov);
      function close() { ov.remove(); }
      ov.querySelector('#shCancel').addEventListener('click', function () {
        close(); reply({ type: 'vizyonedu-share-result', ok: false, name: 'AbortError' });
      });
      ov.querySelector('#shGo').addEventListener('click', async function () {
        try {
          await navigator.share({ files: [file], title: String(d.title || 'VizyonEdu'), text: String(d.text || '') });
          close(); reply({ type: 'vizyonedu-share-result', ok: true });
        } catch (err) {
          close();
          reply({ type: 'vizyonedu-share-result', ok: false, name: (err && err.name) || '', message: (err && err.message) || String(err) });
        }
      });
    });
    // Sert yenileme: iç sayfa istediğinde uygulama çerçevesi önbellek kırıcı parametreyle baştan yüklenir.
    window.addEventListener('message', function (e) {
      if (!/^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/i.test(e.origin)) return;
      var d = e.data;
      if (!d || d.type !== 'vizyonedu-reload' || !d.id) return;
      try { e.source.postMessage({ type: 'vizyonedu-reload-ack', id: d.id }, '*'); } catch (err) {}
      var frame = document.getElementById('app');
      if (!frame) return;
      var base = (frame.getAttribute('data-base') || frame.src).split('?')[0];
      frame.setAttribute('data-base', base);
      setTimeout(function () { frame.src = base + '?r=' + Date.now(); }, 60);
    });
  </script>
</body>
</html>
