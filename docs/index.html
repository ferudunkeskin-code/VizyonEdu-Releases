<!DOCTYPE html>
<html lang="tr" data-vz-app="VizyonEdu Öğretmen">
<head>
<meta name="vz-build" content="64e35e971418">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>VizyonEdu Mobil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;height:100dvh;overflow:hidden;background:#f8fafc}iframe{border:none;width:100%;height:100%;display:block}
#shareOverlay{position:fixed;inset:0;z-index:99999;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.sh-sheet{width:100%;max-width:440px;background:#fff;border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 34px #0004;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#18324a;max-height:90dvh;overflow:auto}
.sh-sheet strong{font-size:1.05rem;color:#174e78}.sh-sheet p{font-size:.85rem;color:#607285;overflow-wrap:anywhere}.sh-sheet button{border:0;border-radius:12px;min-height:48px;padding:10px;font:700 .95rem system-ui,sans-serif;background:#174e78;color:white}.sh-sheet .sh-secondary{background:#eef4f8;color:#174e78}.sh-sheet select{width:100%;min-height:44px;font:inherit;padding:8px;border:1px solid #ccd8e2;border-radius:8px}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyQMRl__AbxTccropfdMou8lNT6pYzIeEAT1kewkrPZW8BJGPjYi6ZzrXAYoDCHi1U/exec" allow="fullscreen; web-share; clipboard-write" loading="eager" title="VizyonEdu"></iframe>
<script>
(function(){
  'use strict';
  var active=null;
  function allowed(origin){return /^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/i.test(origin);}
  function packageFile(bytes,originalName,format){
    var stem=String(originalName||'paket.vzep').replace(/\.vzep$/i,'').replace(/[^0-9A-Za-zÇĞİÖŞÜçğıöşü_.-]+/g,'_').slice(0,160);
    var name=stem+'.vzep';
    if(format==='vzep')return new File([bytes],name,{type:'application/octet-stream'});
    var chunks=[];
    for(var i=0;i<bytes.length;i+=0x8000)chunks.push(String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)));
    return new File(['VIZYONEDU-VZEP-V1\n'+name+'\n'+btoa(chunks.join(''))],stem+'.txt',{type:'text/plain'});
  }
  window.addEventListener('message',function(e){
    if(!allowed(e.origin) || !e.source)return;
    var d=e.data;if(!d || !d.id)return;
    function reply(payload){try{e.source.postMessage(Object.assign({id:d.id},payload),e.origin);}catch(ignore){}}
    if(d.type==='vizyonedu-share-cancel'){
      if(active && active.id===String(d.id) && active.source===e.source)active.close({ok:false,name:'AbortError'});
      return;
    }
    if(d.type==='vizyonedu-reload'){
      reply({type:'vizyonedu-reload-ack'});
      if(active)active.close({ok:false,name:'AbortError'});
      var frame=document.getElementById('app');if(!frame)return;
      var url=new URL(frame.getAttribute('data-base')||frame.src);frame.setAttribute('data-base',url.href);url.searchParams.set('r',String(Date.now()));
      setTimeout(function(){frame.src=url.href;},60);return;
    }
    if(d.type!=='vizyonedu-share')return;
    var bytes;
    try{bytes=new Uint8Array(d.bytes);if(!bytes.length)throw new Error('Paket boş.');}
    catch(err){reply({type:'vizyonedu-share-result',ok:false,name:'FileError',message:String(err)});return;}
    reply({type:'vizyonedu-share-ack',version:2});
    if(active)active.close({ok:false,name:'AbortError'});
    var ov=document.createElement('div');ov.id='shareOverlay';ov.setAttribute('data-id',String(d.id));
    ov.innerHTML='<div class="sh-sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><strong id="shTitle">Paket hazır</strong><p class="sh-sub"></p><label>Dosya biçimi<select id="shFormat"><option value="txt">TXT içinde VZEP (WhatsApp)</option><option value="vzep">VZEP</option></select></label><p class="sh-name"></p><p class="sh-status" role="status" aria-live="polite"></p><button type="button" id="shGo">WhatsApp / Paylaş</button><button type="button" id="shDownload" class="sh-secondary">Dosyayı indir</button><p>Paylaşım açılmazsa indirin. WhatsApp → Ataç → Belge → İndirilenler yoluyla dosyayı seçin.</p><button type="button" id="shCancel" class="sh-secondary">Kapat</button></div>';
    ov.querySelector('.sh-sub').textContent=String(d.text||'');
    var format=ov.querySelector('#shFormat'),status=ov.querySelector('.sh-status'),go=ov.querySelector('#shGo'),download=ov.querySelector('#shDownload'),file,closed=false;
    format.value=d.format==='vzep'?'vzep':'txt';
    function close(result){if(closed)return;closed=true;ov.remove();if(active && active.id===String(d.id))active=null;reply(Object.assign({type:'vizyonedu-share-result'},result));}
    active={id:String(d.id),source:e.source,close:close};
    function prepare(){
      try{file=packageFile(bytes,d.fileName,format.value);ov.querySelector('.sh-name').textContent=file.name;status.textContent='';go.disabled=false;download.disabled=false;}
      catch(err){file=null;status.textContent='Dosya hazırlanamadı: '+String(err);go.disabled=true;download.disabled=true;}
    }
    format.addEventListener('change',prepare);prepare();document.body.appendChild(ov);
    ov.querySelector('#shCancel').addEventListener('click',function(){close({ok:false,name:'AbortError'});});
    go.addEventListener('click',async function(){
      if(!file)return;
      try{
        if(!navigator.share || (navigator.canShare && !navigator.canShare({files:[file]})))throw new Error('Bu dosya biçimi paylaşılamıyor. TXT seçin veya Dosyayı indir düğmesini kullanın.');
        go.disabled=true;await navigator.share({files:[file],title:String(d.title||'VizyonEdu'),text:String(d.text||'')});
        close({ok:true});
      }catch(err){go.disabled=false;status.textContent=err && err.name==='AbortError'?'Paylaşım iptal edildi; yeniden deneyebilir veya indirebilirsiniz.':String(err.message||err);}
    });
    download.addEventListener('click',function(){
      if(!file)return;
      try{var url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},30000);close({ok:true,downloaded:true});}
      catch(err){status.textContent='İndirme başlatılamadı: '+String(err.message||err);}
    });
  });
})();
</script>
<!-- VizyonEdu tarayıcı güvencesi (yalnız GitHub sayfalarına build_github_page.py ekler) -->
<style>
#vzGuard{position:fixed;left:0;right:0;bottom:0;z-index:2147483000;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;font:600 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#vzGuard .vz-box{max-width:520px;margin:0 auto;background:#fff;color:#18324a;border-radius:16px;box-shadow:0 -6px 28px #0003;padding:14px;display:flex;flex-direction:column;gap:8px;border-top:4px solid #174e78}
#vzGuard.warn .vz-box{border-top-color:#c0392b}
#vzGuard strong{font-size:15px;color:#174e78}#vzGuard.warn strong{color:#a13b25}
#vzGuard p{margin:0;font-weight:500;font-size:13.5px;color:#4a5d70}
#vzGuard .vz-row{display:flex;gap:8px;flex-wrap:wrap}
#vzGuard button,#vzGuard a{flex:1 1 auto;border:0;border-radius:11px;min-height:44px;padding:8px 12px;font:700 14px system-ui,sans-serif;background:#174e78;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
#vzGuard .vz-2{background:#eef4f8;color:#174e78}
</style>
<div id="vzGuard" role="status" aria-live="polite"><div class="vz-box"><strong></strong><p></p><div class="vz-row"></div></div></div>
<script>
(function(){
  'use strict';
  var APP=document.documentElement.getAttribute('data-vz-app')||'VizyonEdu';
  var box=document.getElementById('vzGuard');if(!box)return;
  var ua=navigator.userAgent||'';
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  function show(kind,title,text,buttons){
    box.className=kind;box.querySelector('strong').textContent=title;box.querySelector('p').textContent=text;
    var row=box.querySelector('.vz-row');row.innerHTML='';
    buttons.forEach(function(b){var el=document.createElement(b.href?'a':'button');el.textContent=b.label;if(b.href)el.href=b.href;if(b.second)el.className='vz-2';
      el.addEventListener('click',function(e){if(b.fn){e.preventDefault();b.fn();}});row.appendChild(el);});
    box.style.display='block';
  }
  function hide(){box.style.display='none';}
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  // Uygulama içi tarayıcılar: WhatsApp, Facebook, Instagram, Android WebView («wv»).
  var inApp=/WhatsApp|FBAN|FBAV|Instagram|Line\/|; wv\)/i.test(ua);
  var android=/Android/i.test(ua);
  var hint=null;
  if(inApp){
    var b=[];
    if(android){b.push({label:'Chrome\'da aç',href:'intent://'+location.host+location.pathname+location.search+'#Intent;scheme=https;package=com.android.chrome;end'});}
    b.push({label:'Daha sonra',second:true,fn:hide});
    hint=['warn','Uygulama içinde açtınız',
      'Bu sayfa WhatsApp gibi bir uygulamanın içinde açıldı. Kayıtlarınızın ve girişinizin kaybolmaması için sayfayı '+(android?'Chrome':'Safari')+'\'da açın ve «Ana ekrana ekle» deyin; sonra hep o simgeden girin.',b];
  }else if(!standalone && !store('vz-home-hint-ok')){
    hint=['','Ana ekrana ekleyin',
      (/iPhone|iPad/i.test(ua)?'Paylaş ⬆︎ → «Ana Ekrana Ekle»':'Tarayıcı menüsü ⋮ → «Ana ekrana ekle»')+'. '+APP+' hep aynı simgeden açılırsa girişiniz ve bekleyen kayıtlarınız korunur.',
      [{label:'Tamam',fn:function(){store('vz-home-hint-ok','1');hide();}}]];
  }
  if(hint)show(hint[0],hint[1],hint[2],hint[3]);
  // Yeni sürüm: sayfanın yayındaki kopyası farklı bir yapı kimliği taşıyorsa yenile şeridi.
  var meta=document.querySelector('meta[name="vz-build"]'),mine=meta?meta.content:'',last=0;
  function check(){
    if(!mine||Date.now()-last<10*60*1000)return;last=Date.now();
    fetch(location.pathname+'?vzc='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
      var m=/<meta name="vz-build" content="([^"]+)"/.exec(t||'');
      if(m&&m[1]!==mine)show('','Yeni sürüm var',APP+' güncellendi. Yenilemek için dokunun.',[
        {label:'Yenile',fn:function(){location.replace(location.pathname+'?v='+m[1]);}},{label:'Sonra',second:true,fn:hide}]);
    }).catch(function(){});
  }
  check();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
})();
</script>

</body>
