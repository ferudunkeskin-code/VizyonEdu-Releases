<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>VizyonEdu Mobil</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #f8fafc;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbyQMRl__AbxTccropfdMou8lNT6pYzIeEAT1kewkrPZW8BJGPjYi6ZzrXAYoDCHi1U/exec"
    allow="fullscreen; web-share; clipboard-write"
    loading="eager"
    title="VizyonEdu">
  </iframe>
  <script>
    // Apps Script sayfası Google'ın iç iframe'inde çalışır ve web-share iznini alamaz.
    // Paylaşım menüsü bu üst sayfadan açılır; dosya postMessage ile gelir.
    window.addEventListener('message', async function (e) {
      if (!/^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/i.test(e.origin)) return;
      var d = e.data;
      if (!d || d.type !== 'vizyonedu-share' || !d.id) return;
      function reply(payload) {
        try { e.source.postMessage(Object.assign({ id: d.id }, payload), '*'); } catch (err) {}
      }
      reply({ type: 'vizyonedu-share-ack' });
      try {
        var name = String(d.fileName || 'paket.vzep').replace(/[^A-Za-z0-9_.\-]+/g, '_').slice(0, 120);
        if (!/\.vzep$/i.test(name)) name += '.vzep';
        var file = new File([d.bytes], name, { type: 'application/octet-stream' });
        if (!navigator.share) { reply({ type: 'vizyonedu-share-result', ok: false, why: 'no-share' }); return; }
        if (navigator.canShare && !navigator.canShare({ files: [file] })) {
          reply({ type: 'vizyonedu-share-result', ok: false, why: 'can-not-share-type' }); return;
        }
        await navigator.share({ files: [file], title: String(d.title || 'VizyonEdu'), text: String(d.text || '') });
        reply({ type: 'vizyonedu-share-result', ok: true });
      } catch (err) {
        reply({ type: 'vizyonedu-share-result', ok: false, name: (err && err.name) || '', message: (err && err.message) || String(err) });
      }
    });
    // Sert yenileme: iç sayfa istediğinde uygulama çerçevesi önbellek kırıcı parametreyle baştan yüklenir.
    window.addEventListener('message', function (e) {
      if (!/^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/i.test(e.origin)) return;
      var d = e.data;
      if (!d || d.type !== 'vizyonedu-reload' || !d.id) return;
      try { e.source.postMessage({ type: 'vizyonedu-reload-ack', id: d.id }, '*'); } catch (err) {}
      var frame = document.getElementById('app');
      if (!frame) return;
      var base = (frame.getAttribute('data-base') || frame.src).split('?')[0];
      frame.setAttribute('data-base', base);
      setTimeout(function () { frame.src = base + '?r=' + Date.now(); }, 60);
    });
  </script>
</body>
</html>
