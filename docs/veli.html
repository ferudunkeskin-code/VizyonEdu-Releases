<!doctype html>
<html lang="tr" data-vz-app="VizyonEdu Veli">
<head>
<meta name="vz-build" content="35240e34c5b4">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#173d62">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VizyonEdu Veli">
  <title>VizyonEdu Veli</title>
  <style>:root{
  --navy:#173d62;--ink:#203248;--muted:#596776;--line:#d5e0ea;--bg:#f3f6f9;--white:#fff;
  --green:#1e7a46;--amber:#9a6700;--red:#a13b25;
  --c-odev:#2f80ed;--c-onay:#27ae60;--c-feedback:#8e6bd8;--c-guidance:#f2994a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
.topbar{
  padding:16px max(14px,env(safe-area-inset-left));
  padding-top:max(16px,env(safe-area-inset-top));
  background:linear-gradient(135deg,#173d62,#2a5f8f);color:#fff;
  box-shadow:0 4px 16px #173d6230;
}
.topbar small{letter-spacing:.12em;font-size:.65rem;font-weight:800;opacity:.8}
.topbar h1{margin:2px 0 0;font-size:1.15rem}
.topbar p{margin:4px 0 0;font-size:.8rem;opacity:.88}
.topbar p:empty{display:none}
main{max-width:640px;margin:0 auto;padding:12px 12px 40px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 4px 14px #173d620a;padding:14px;margin:0 0 12px;
}
.card h2{margin:0 0 10px;font-size:1.02rem;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{color:var(--muted);font-size:.82rem;margin:0 0 12px}
label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:750;color:#486581;margin:10px 0}
input,select{
  width:100%;border:1px solid #cbd8e3;border-radius:10px;background:#fff;
  font:inherit;min-height:46px;padding:10px 12px;color:var(--ink);
}
button{
  border:0;border-radius:10px;background:var(--navy);color:#fff;
  min-height:46px;padding:11px 14px;font-weight:750;font-size:.92rem;line-height:1.2;font-family:inherit;cursor:pointer;width:100%;margin:6px 0 0;
}
button:disabled{opacity:.45}
button.secondary{background:#eef3f8;color:var(--navy)}
.brand-mark{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:var(--navy);color:#fff;font-size:1.4rem;font-weight:900;margin-bottom:10px;
}
.login-card{max-width:420px;margin:28px auto}
.student-switch{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
.student-chip{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  text-align:left;background:#f7fafc;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--ink);width:100%;margin:0;
}
.student-chip.active{border-color:#4da3ff;background:#eef6fc;box-shadow:0 0 0 2px #4da3ff30}
.student-chip b{display:block;font-size:.95rem}
.student-chip small{color:var(--muted);font-size:.75rem}
.empty-state{text-align:center;padding:20px 12px;color:var(--muted);font-size:.86rem}
.empty-state strong{display:block;color:var(--navy);margin-bottom:6px}
#status{
  position:fixed;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));z-index:5000;
  transform:translateY(-150%);transition:.2s;background:#174e78;color:#fff;border-radius:10px;
  padding:11px 13px;box-shadow:0 7px 25px #0004;font-size:.82rem;font-weight:700;
}
#status.show{transform:translateY(0)}
#status.err{background:#a13b25}
#status.ok{background:#187647}
.logout-row{margin-top:18px}
footer{text-align:center;padding:8px;color:var(--muted);font-size:.72rem}
.muted{color:var(--muted)}.sm{font-size:.78rem}

/* yönetim (denetim kodu) öğrenci seçimi */
.adm-filters{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.adm-filters select,.adm-filters input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;background:#fff;color:var(--navy)}
.adm-active{background:#eef6fc;border:1px solid #4da3ff;border-radius:12px;padding:10px 12px;margin:4px 0 8px}
.adm-active b{display:block;color:var(--navy)}.adm-active small{color:var(--muted);font-size:.75rem}
.adm-count{color:var(--muted);font-size:.74rem;margin:2px 2px 6px}
.adm-list{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* öğrenci başlığı */
.who{display:flex;gap:14px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#dbe8f4,#c2d6ea);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;color:var(--navy);flex:0 0 auto;border:3px solid #fff;box-shadow:0 2px 8px #173d6222;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.who-txt{min-width:0;flex:1}
.who-txt b{display:block;font-size:1.15rem;color:var(--ink)}.who-txt span{display:block;font-size:.85rem;color:var(--muted)}
.who-txt span.pill{display:inline-block}
.pill{display:inline-block;background:#eef4f8;color:var(--navy);font-weight:700;font-size:.75rem;border-radius:999px;padding:3px 10px;margin-top:6px}
.pill.old{background:#fff6e5;color:#7a4a12}
.refresh{width:40px;min-height:40px;height:40px;padding:0;margin:0;border-radius:50%;background:#eef4f8;color:var(--navy);font-size:1.15rem;flex:0 0 auto}
.refresh.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{font-size:.78rem;color:#7a4a12;background:#fff6e5;border:1px solid #f4d9a6;border-radius:10px;padding:8px 10px;margin:0 0 12px}

/* geç gelme şeridi */
.late{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.88rem;font-weight:650;width:100%;min-height:0;text-align:left;font-family:inherit;line-height:1.35}
.late.warn{background:#fff6e5;border:1px solid #f4d9a6;color:#7a4a12}.late.ok{background:#eef8f2;border:1px solid #c9e8d5;color:var(--green)}
.late .ic{font-size:1.1rem}.late .go{margin-left:auto;font-size:.75rem;opacity:.8;white-space:nowrap}
.late-days{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px;padding:0 2px}
.late-days span{background:#fff;border:1px solid #f4d9a6;color:#7a4a12;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:700}

/* rozetler */
.badge-live{font-size:.62rem;font-weight:800;color:var(--green);background:#e3f4ea;border-radius:6px;padding:2px 6px;white-space:nowrap}
.badge-rep{font-size:.62rem;font-weight:800;color:var(--amber);background:#fff1d6;border-radius:6px;padding:2px 6px;white-space:nowrap}

/* sınav */
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.kpi{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:1.35rem;color:var(--navy);font-variant-numeric:tabular-nums}.kpi small{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:.76rem}.chip .n{font-weight:700}.chip .s{color:var(--muted)}.chip .s b{color:var(--navy)}
.chip .g{color:var(--amber);font-weight:800}

/* sekmeler */
.tabs{display:flex;background:#eef4f8;border-radius:11px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font:700 .85rem system-ui;color:var(--muted);margin:0;min-height:38px;width:auto}
.tabs .on{background:#fff;color:var(--navy);box-shadow:0 1px 4px #173d6222}

/* eksik kazanım kartı */
.gain{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.gain .crs{font-size:.7rem;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.gain h3{margin:2px 0 4px;font-size:.95rem;color:var(--ink)}
.alts{font-size:.76rem;color:var(--muted);margin:0 0 8px}
.bar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:#edf1f5}
.bar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;font-size:.66rem;color:var(--muted)}
.legend span{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.legend b{font-size:.78rem;color:var(--ink)}
.legend em{font-style:normal;font-size:.62rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.legend span::before{content:"";width:10px;height:4px;border-radius:2px;margin-bottom:3px;background:var(--c)}
.done{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.done strong{font-size:.95rem;color:var(--navy)}.done em{font-style:normal;font-size:.72rem;color:var(--muted);text-align:right}
.tasks{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.tasks h4{margin:0 0 6px;font-size:.78rem;color:var(--navy)}
.task{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:.82rem}
.task .st{flex:0 0 auto;font-size:.68rem;font-weight:800;border-radius:6px;padding:2px 6px}
.st.ok{background:#e3f4ea;color:var(--green)}.st.wip{background:#fff1d6;color:var(--amber)}
.task small{display:block;color:var(--muted);font-size:.7rem}

/* KKT sonuçları */
details.acc{border:1px solid var(--line);border-radius:11px;margin-bottom:6px}
details.acc summary{list-style:none;padding:10px 12px;font-weight:700;font-size:.86rem;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc .body{padding:0 12px 10px}
.qrow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef2f6;padding:7px 0;font-size:.82rem;gap:8px}
.qrow b{color:var(--navy);white-space:nowrap}.qrow .g{color:var(--amber);font-weight:800}

/* genel */
.sec{font-size:.8rem;font-weight:800;color:var(--navy);margin:14px 0 6px;letter-spacing:.02em}
.sec:first-of-type{margin-top:2px}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f6;font-size:.84rem}
.list .it:last-child{border-bottom:0}.list .it small{display:block;color:var(--muted);font-size:.72rem}
.hw{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;font-size:.8rem;align-items:center}
.hw .h{font-size:.66rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.hw .cur{font-weight:700}
.hw .cur::after{content:" · güncel";font-weight:600;color:var(--muted);font-size:.7rem}
.mark{font-weight:700;text-align:center;white-space:nowrap;font-size:.74rem}.mark.y{color:var(--green)}.mark.n{color:#b8c3cf}
.src{font-size:.68rem;color:var(--muted);margin-top:8px}

/* sınav ve KKT listesi: dikeyde kartlar, yatayda tablo (body.land ya da medya sorgusu) */
.ex-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;color:var(--ink);padding:0 0 8px;margin:0;min-height:0;text-align:left;width:100%}
.ex-t b{display:block;font-size:.92rem;color:var(--navy)}.ex-t small{color:var(--muted);font-size:.72rem;font-weight:600}
.ex-arrow{color:var(--muted);font-size:.9rem}
.ex-table-wrap{display:none;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
.ex-table{border-collapse:collapse;width:100%;font-size:.74rem;font-variant-numeric:tabular-nums}
.ex-table th,.ex-table td{padding:5px 6px;border-bottom:1px solid #e8eef3;text-align:center;white-space:nowrap}
.ex-table th{background:#edf4fa;color:#486581;font-size:.68rem}.ex-table th small{display:block;font-weight:600;opacity:.75}
.ex-table th.grp{border-left:2px solid #d5e0ea;background:#dceaf6}
.ex-table th.sub{font-size:.62rem;padding:3px 5px}.ex-table th.sub:first-child{border-left:2px solid #d5e0ea}
.ex-table td.n,.ex-table th.n{font-weight:800;color:var(--navy)}
.ex-table td.t{text-align:left;font-weight:700;color:var(--navy);position:sticky;left:0;background:#fff}
.ex-table td.dt{color:var(--muted);font-size:.68rem}
.ex-table td.b{font-weight:800;color:var(--navy);background:#f6f9fc}
.ex-table td.g{color:var(--amber);font-weight:800}.ex-table td.m{color:#b8c3cf}
body.land main{max-width:980px}
body.land .gain,body.land .late,body.land .late-days{max-width:640px}  /* eksik kazanım kartları dikeydeki gibi kalır */
body.land .ex-cards{display:none}
body.land .ex-table-wrap{display:block}
@media (orientation:landscape) and (min-width:480px){
  main{max-width:980px}
  .gain{max-width:640px}
  .ex-cards{display:none}
  .ex-table-wrap{display:block}
}

/* Misafir öğrenci: tek öneri hücresi */
.gain .advice{margin:10px 0 4px;padding:10px 12px;border-radius:10px;background:var(--advice-bg,#fff7e6);color:var(--advice-fg,#8a4b00);border:1px solid var(--advice-bd,#f5d9a8);font-weight:600;font-size:.92rem}
.pill.guest{background:#fff7e6;color:#8a4b00;border:1px solid #f5d9a8}
@media (prefers-color-scheme: dark){.gain .advice,.pill.guest{background:#3a2a10;color:#f5c97a;border-color:#6b4a14}}
</style>
</head>
<body>
  <div id="status" role="status" aria-live="polite"></div>

  <header class="topbar">
    <div>
      <small>VİZYONEDU · VELİ</small>
      <h1 id="portalTitle">Öğrenci Takibi</h1>
      <p id="headerSub"></p>
    </div>
  </header>

  <main>
    <!-- Giriş -->
    <section class="card login-card" id="loginCard">
      <div class="brand-mark">V</div>
      <h2>Veli girişi</h2>
      <p class="hint">Erişim kodu bağlantıyla dolar; kurumda kayıtlı telefon numaranızı yazın. Kod ilk giriş yaptığınız telefona bağlanır.</p>
      <label>Erişim kodu
        <input id="parentCode" type="text" inputmode="text" autocomplete="one-time-code"
               placeholder="Örn. V7K2M9" maxlength="16" autocapitalize="characters">
      </label>
      <label>Telefon numarası
        <input id="parentPhone" type="tel" inputmode="tel" autocomplete="tel"
               placeholder="05XX XXX XX XX" maxlength="20">
      </label>
      <button type="button" id="btnParentLogin">Giriş yap</button>
    </section>

    <!-- Oturum -->
    <div id="sessionArea" hidden>
      <section class="card" id="studentCard" hidden>
        <h2 id="studentCardTitle">Öğrencileriniz</h2>
        <p class="hint" id="parentLabelLine"></p>
        <div class="student-switch" id="studentSwitch"></div>
      </section>

      <div id="liveArea" hidden>
        <section class="card"><div class="who" id="who"></div></section>
        <div id="indexNotice"></div>
        <div id="lateBox"></div>
        <section class="card" id="examCard"></section>
        <section class="card" id="kktCard"></section>
        <section class="card" id="generalCard"></section>
      </div>

      <div class="logout-row">
        <button type="button" class="secondary" id="btnParentLogout">Çıkış yap</button>
      </div>
    </div>
  </main>

  <footer>Veriler yalnızca size bağlı öğrenci için gösterilir. İç öğretmen notları paylaşılmaz.</footer>
  <script>window.VIZYONEDU_API_URL = "https://script.google.com/macros/s/AKfycbyQMRl__AbxTccropfdMou8lNT6pYzIeEAT1kewkrPZW8BJGPjYi6ZzrXAYoDCHi1U/exec";</script>
  <script>(function () {
  var KEY = 'vizyonedu_parent_session_v2';
  var OLD_KEYS = ['vizyonedu_parent_session_v1'];
  var DEVICE_KEY = 'vizyonedu_parent_device_v1';
  var sessionVersion = 0;
  var photos = {}, photoAsked = {};  // öğrenci fotoğrafları yalnız bellekte
  var state = emptyState();
  var ui = { kktTab: '', examSel: {}, lateOpen: false, actMore: false };

  function emptyState() {
    return { parentCode: '', sessionToken: '', parentLabel: '', students: [], activeNo: '', liveCache: {},
      isAdmin: false, adminRole: '', adminClass: '', adminQuery: '' };
  }
  function $(id) { return document.getElementById(id); }

  var statusTimer = null;
  function log(msg, ok) {
    var el = $('status');
    if (!el) return;
    el.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg);
    el.className = 'show ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { el.className = ''; }, ok === false ? 8000 : 4500);
  }

  // ───────────────────────── yerel hafıza ─────────────────────────
  function readState() {
    try {
      var raw = localStorage.getItem(KEY), legacy = false;
      if (!raw) {
        // Eski sayfanın oturumu taşınır (veli yeniden telefon yazmasın); eski rapor önbelleği alınmaz.
        for (var i = 0; i < OLD_KEYS.length && !raw; i++) { raw = localStorage.getItem(OLD_KEYS[i]); legacy = !!raw; }
      }
      if (!raw) return;
      var s = JSON.parse(raw);
      state.parentCode = s.parentCode || '';
      state.sessionToken = s.sessionToken || '';
      state.parentLabel = s.parentLabel || '';
      state.students = s.students || [];
      state.activeNo = s.activeNo || '';
      state.liveCache = legacy ? {} : (s.liveCache || {});
      state.isAdmin = !!s.isAdmin;
      state.adminRole = s.adminRole || '';
      state.adminClass = s.adminClass || '';
      if (legacy) { writeState(); OLD_KEYS.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} }); }
    } catch (e) {}
  }
  function writeState() {
    var keys = Object.keys(state.liveCache || {}), cur = cacheKey(), limit = state.isAdmin ? 4 : 6;
    while (keys.length > limit) {
      var drop = keys.shift();
      if (drop !== cur) delete state.liveCache[drop];
    }
    var data = { parentCode: state.parentCode, sessionToken: state.sessionToken, parentLabel: state.parentLabel,
      students: state.students, activeNo: state.activeNo, liveCache: state.liveCache || {}, isAdmin: !!state.isAdmin,
      adminRole: state.adminRole || '', adminClass: state.adminClass || '' };
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { data.liveCache = {}; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e2) {} }
  }
  function clearState() {
    sessionVersion += 1;
    photos = {}; photoAsked = {};
    state = emptyState();
    ui = { kktTab: '', examSel: {}, lateOpen: false, actMore: false };
    try { localStorage.removeItem(KEY); } catch (e) {}
    ['who', 'indexNotice', 'lateBox', 'examCard', 'kktCard', 'generalCard', 'studentSwitch'].forEach(function (id) { if ($(id)) $(id).innerHTML = ''; });
  }

  // Cihaz kimliği çıkışta silinmez; kod bu cihaza bağlanır.
  function deviceId() {
    try {
      var id = localStorage.getItem(DEVICE_KEY);
      if (id && /^[A-Za-z0-9_-]{16,80}$/.test(id)) return id;
      var bytes = new Uint8Array(24);
      (window.crypto || window.msCrypto).getRandomValues(bytes);
      id = Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      localStorage.setItem(DEVICE_KEY, id);
      return id;
    } catch (e) { return ''; }
  }

  function apiUrl() {
    var u = String(window.VIZYONEDU_API_URL || '').trim();
    if (u) return u;
    try { if (/script\.google\.com/.test(window.location.href)) return window.location.href.split('?')[0]; } catch (ignore) {}
    return '';
  }

  async function api(body) {
    body = body || {};
    body.parent_code = body.parent_code || state.parentCode || ($('parentCode') && $('parentCode').value) || '';
    body.device_id = deviceId();
    if (body.action !== 'parent_login') body.session_token = state.sessionToken || '';
    var reply;
    if (window.google && google.script && google.script.run) {
      reply = await new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).invoke(body);
      });
    } else {
      var url = apiUrl();
      if (!url) throw new Error('Bağlantı adresi bulunamadı. Uygulamayı verilen linkten açın.');
      var res;
      try {
        res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      } catch (e) { throw new Error('Ağ bağlantısı yok veya sunucuya erişilemiyor.'); }
      var text = await res.text();
      try { reply = JSON.parse(text); } catch (e) { throw new Error('Beklenmeyen yanıt: ' + text.slice(0, 200)); }
    }
    if (!reply || !reply.ok) {
      var err = new Error((reply && reply.error) || 'Hata');
      err.code = reply && reply.code;
      if (/Bilinmeyen veli action/.test(err.message)) err.message = 'Sunucu henüz güncellenmedi. Kurum güncellemeyi tamamlayınca sayfa çalışacak.';
      if (err.code === 'PARENT_AUTH' && body.action !== 'parent_login') { clearState(); showLogin(); }
      throw err;
    }
    return reply;
  }

  // ───────────────────────── yardımcılar ─────────────────────────
  var MONTHS = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function studentKey(value) {
    var raw = String(value == null ? '' : value).trim().replace(/\s/g, '').replace(/\.0$/, '');
    if (!/^\d+$/.test(raw)) return '';
    return raw.replace(/^0+/, '');
  }
  function cacheKey() { return state.parentCode + '|' + studentKey(state.activeNo); }
  function trKey(v) { return String(v || '').toLocaleLowerCase('tr').replace(/\s+/g, ' ').trim(); }
  function dateTime(iso) {
    var d = new Date(iso);
    if (!iso || isNaN(d.getTime())) return '';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function dayMonth(iso) {
    var d = new Date(iso);
    return (!iso || isNaN(d.getTime())) ? '' : d.getDate() + ' ' + MONTHS[d.getMonth()];
  }
  function fmtNum(v) {
    if (v == null || v === '') return '—';
    if (typeof v === 'number') return String(Math.round(v * 100) / 100).replace('.', ',');
    return String(v);
  }
  function initials(name) {
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return (parts[0].charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '')).toLocaleUpperCase('tr-TR');
  }
  function activeStudent() {
    var no = studentKey(state.activeNo);
    return state.students.filter(function (s) { return studentKey(s.no) === no; })[0] || null;
  }
  function validateIdentity(d, expectedNo) {
    var expected = studentKey(expectedNo);
    var allowed = state.students.filter(function (st) { return studentKey(st.no) === expected; });
    if (!expected || allowed.length !== 1 || !d || studentKey(d.student_no) !== expected ||
        studentKey(d.student && d.student.no) !== expected) {
      throw new Error('Öğrenci kimliği doğrulanamadı. İçerik gösterilmedi.');
    }
  }
  function reportDate(d) { return d && d.report && d.report.published_at ? dayMonth(d.report.published_at) : ''; }
  function srcBadge(src, d) {
    if (src === 'live') return '<span class="badge-live">anlık</span>';
    if (src === 'published') return '<span class="badge-live">yayımlandı' + (d && d.published && d.published.updated_at ? ' · ' + esc(dayMonth(d.published.updated_at)) : '') + '</span>';
    var rd = reportDate(d);
    return '<span class="badge-rep">son rapordan' + (rd ? ' · ' + esc(rd) : '') + '</span>';
  }

  // ───────────────────────── ekranlar ─────────────────────────
  function showLogin() {
    $('loginCard').hidden = false;
    $('sessionArea').hidden = true;
    $('portalTitle').textContent = 'Veli Portalı';
    $('headerSub').textContent = '';
  }
  function showSession() {
    $('loginCard').hidden = true;
    $('sessionArea').hidden = false;
    var adm = !!state.isAdmin;
    $('portalTitle').textContent = adm ? 'Yönetim · Öğrenci Takibi' : 'Öğrenci Takibi';
    $('headerSub').textContent = adm ? ((state.adminRole || state.parentLabel || 'Yönetim') + ' · salt okunur') : (state.parentLabel || '');
    $('studentCard').hidden = !adm && state.students.length < 2;
    $('studentCardTitle').textContent = adm ? 'Öğrenci seçimi' : 'Öğrencileriniz';
    $('parentLabelLine').textContent = adm ? 'Sınıf seçin veya ad / numara yazın.' : 'Öğrenciler arasında geçiş yapabilirsiniz.';
    renderStudentSwitch();
    renderLive();
  }

  function selectStudent(no) {
    state.activeNo = String(no);
    ui.lateOpen = false; ui.actMore = false;
    writeState();
    renderStudentSwitch();
    renderLive();
    syncLive(false);
  }

  function renderAdminSwitch() {
    var box = $('studentSwitch'), classes = [];
    state.students.forEach(function (st) { if (st.class && classes.indexOf(st.class) < 0) classes.push(st.class); });
    classes.sort(function (a, b) { return a.localeCompare(b, 'tr', { numeric: true }); });
    if (state.adminClass && classes.indexOf(state.adminClass) < 0) state.adminClass = '';
    var active = activeStudent();
    var h = '<div class="adm-filters"><select id="admClass" aria-label="Sınıf"><option value="">Tüm sınıflar (' + state.students.length + ')</option>';
    classes.forEach(function (c) { h += '<option value="' + esc(c) + '"' + (c === state.adminClass ? ' selected' : '') + '>' + esc(c) + '</option>'; });
    h += '</select><input id="admQuery" type="search" placeholder="Ad veya numara ara" autocomplete="off" value="' + esc(state.adminQuery) + '"></div>';
    if (active) h += '<div class="adm-active"><b>' + esc(active.name || ('Öğrenci ' + active.no)) + '</b><small>No: ' + esc(active.no) + (active.class ? ' · ' + esc(active.class) : '') + '</small></div>';
    h += '<div class="adm-count" id="admCount"></div><div class="adm-list" id="admList"></div>';
    box.innerHTML = h;
    function fill() {
      var q = trKey(state.adminQuery);
      var list = state.students.filter(function (st) {
        if (state.adminClass && st.class !== state.adminClass) return false;
        return !q || trKey(st.name).indexOf(q) >= 0 || String(st.no).indexOf(q.replace(/\s/g, '')) >= 0;
      });
      var cap = 80;
      $('admCount').textContent = list.length + ' öğrenci' + (list.length > cap ? ' · ilk ' + cap + ' gösteriliyor, aramayı daraltın' : '');
      $('admList').innerHTML = list.slice(0, cap).map(function (st) { return chipHtml(st); }).join('') || '<p class="hint">Eşleşen öğrenci yok.</p>';
    }
    fill();
    $('admClass').addEventListener('change', function () { state.adminClass = this.value; writeState(); fill(); });
    $('admQuery').addEventListener('input', function () { state.adminQuery = this.value; fill(); });
    $('admList').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-no]') : null;
      if (b) selectStudent(b.getAttribute('data-no'));
    });
  }
  function chipHtml(st) {
    return '<button type="button" class="student-chip' + (String(st.no) === String(state.activeNo) ? ' active' : '') + '" data-no="' + esc(st.no) + '">' +
      '<span><b>' + esc(st.name || ('Öğrenci ' + st.no)) + '</b><small>No: ' + esc(st.no) + (st.class ? ' · ' + esc(st.class) : '') + '</small></span>' +
      '<span aria-hidden="true">›</span></button>';
  }
  function renderStudentSwitch() {
    var box = $('studentSwitch');
    if (state.isAdmin) { renderAdminSwitch(); return; }
    if (!state.students.length) { box.innerHTML = '<p class="hint">Bu koda bağlı öğrenci bulunamadı. Kurumla iletişime geçin.</p>'; return; }
    box.innerHTML = state.students.map(chipHtml).join('');
  }

  function renderLive() {
    var st = activeStudent();
    $('liveArea').hidden = !st;
    if (!st) {
      if (!state.isAdmin && !state.students.length) {
        $('studentCard').hidden = false;
      }
      return;
    }
    var d = state.liveCache[cacheKey()] || null;
    renderWho(st, d);
    if (!d) {
      $('indexNotice').innerHTML = '';
      $('lateBox').innerHTML = '';
      ['examCard', 'kktCard', 'generalCard'].forEach(function (id) {
        $(id).innerHTML = '<div class="empty-state"><strong>Yükleniyor…</strong>Bilgiler alınıyor.</div>';
      });
      return;
    }
    $('indexNotice').innerHTML = (d.index && !d.index.ready && (d.kkt.src === 'report' || (d.general && d.general.src === 'report')))
      ? '<div class="notice">Anlık veriler hazırlanıyor; şimdilik son rapordaki bilgiler gösteriliyor.</div>' : '';
    renderLate(d);
    renderExams(d);
    renderKkt(d);
    renderGeneral(d);
  }

  function renderWho(st, d) {
    var name = (d && d.student && d.student.name) || st.name || ('Öğrenci ' + st.no);
    var cls = (d && d.student && d.student.class) || st.class || '';
    var at = d && d.generated_at, old = at && Date.now() - new Date(at).getTime() > 10 * 60 * 1000;
    var photo = photos[cacheKey()];
    $('who').innerHTML = '<div class="avatar">' + (photo ? '<img src="' + esc(photo) + '" alt="">' : esc(initials(name))) + '</div>' +
      '<div class="who-txt"><b>' + esc(name) + '</b><span>' + esc([cls, 'No ' + st.no].filter(Boolean).join(' · ')) +
      (d && d.student && d.student.guest ? ' <span class="pill guest">Misafir öğrenci</span>' : '') + '</span>' +
      (at ? '<span class="pill' + (old ? ' old' : '') + '">' + (old ? 'Son alınan · ' : 'Güncel · ') + esc(dateTime(at)) + '</span>' : '') + '</div>' +
      '<button type="button" class="refresh' + (syncing ? ' spin' : '') + '" id="btnRefresh" aria-label="Yenile" title="Yenile">↻</button>';
    $('btnRefresh').addEventListener('click', function () { syncLive(true, true); });
    loadPhoto(st);
  }

  // Öğrenci fotoğrafı: yalnız bellekte (cihaza kaydedilmez); öğrenci başına oturumda bir kez istenir.
  async function loadPhoto(st) {
    var key = cacheKey(), no = studentKey(st && st.no), session = sessionVersion;
    if (!no || !state.sessionToken || photoAsked[key]) return;
    photoAsked[key] = true;
    try {
      var r = await api({ action: 'parent_photo', student_no: no, parent_code: state.parentCode });
      if (session !== sessionVersion || studentKey(r.student_no) !== no) return;
      if (typeof r.photo === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(r.photo)) {
        photos[key] = r.photo;
        if (cacheKey() === key && $('who')) {
          var box = $('who').querySelector('.avatar');
          if (box) box.innerHTML = '<img src="' + esc(r.photo) + '" alt="">';
        }
      }
    } catch (e) {
      // Sunucu henüz güncellenmediyse veya fotoğraf yoksa baş harfler kalır.
    }
  }

  function renderLate(d) {
    var box = $('lateBox'), L = d.late;
    if (!L) { box.innerHTML = ''; return; }
    if (!L.count) {
      box.innerHTML = '<div class="late ok"><span class="ic">✓</span><span>Derslere zamanında geliyor</span></div>';
      return;
    }
    var html = '<button type="button" class="late warn" id="btnLate" aria-expanded="' + (ui.lateOpen ? 'true' : 'false') + '">' +
      '<span class="ic">⏰</span><span>Bu dönem <b>' + L.count + ' kez</b> ilk derse zamanında gelmedi · son: ' + esc(L.days[0].label) + '</span>' +
      '<span class="go">' + (ui.lateOpen ? 'gizle ‹' : 'ayrıntı ›') + '</span></button>';
    if (ui.lateOpen) html += '<div class="late-days">' + L.days.map(function (x) { return '<span>' + esc(x.label) + '</span>'; }).join('') + '</div>';
    box.innerHTML = html;
    $('btnLate').addEventListener('click', function () { ui.lateOpen = !ui.lateOpen; renderLate(d); });
  }

  // ── Sınav ve KKT sonuçları: aynı görünüm. Dikey: kartlar (ilki açık). Yatay: bütün liste tek tabloda. ──
  // rows: [{title, date, total, class_rank, inst_rank, subjects: [{name, D, Y, B, Net, status}]}] — en yeni başta
  function scoreListHtml(rows, group) {
    var key = cacheKey() + '|' + group, open = ui.examSel[key] == null ? 0 : Number(ui.examSel[key]);
    function cell(s) {
      if (s.status === 'G' || s.status === 'g') return '<span class="g">G · girmedi</span>';
      if (s.status === '?') return '<span class="muted">—</span>';
      return 'D ' + esc(fmtNum(s.D)) + ' · Y ' + esc(fmtNum(s.Y)) + ' · B ' + esc(fmtNum(s.B)) + ' · <b>Net ' + esc(fmtNum(s.Net)) + '</b>';
    }
    var html = '<div class="ex-cards">' + rows.map(function (ex, i) {
      var chips = '<div class="chips">' + (ex.subjects || []).map(function (s) {
        return '<div class="chip"><div class="n">' + esc(s.name) + '</div><div class="s">' + cell(s) + '</div></div>';
      }).join('') + '</div>';
      return '<div class="ex-card' + (i === open ? ' open' : '') + '"><button type="button" class="ex-head" data-ex="' + group + ':' + i + '">' +
        '<span class="ex-t"><b>' + esc(ex.title) + '</b><small>' + esc(ex.date || '') + '</small></span><span class="ex-arrow">' + (i === open ? '▾' : '▸') + '</span></button>' +
        '<div class="kpis"><div class="kpi"><b>' + esc(fmtNum(ex.total)) + '</b><small>Toplam net</small></div>' +
        '<div class="kpi"><b>' + esc(fmtNum(ex.class_rank)) + '</b><small>Sınıf sırası</small></div>' +
        '<div class="kpi"><b>' + esc(fmtNum(ex.inst_rank)) + '</b><small>Kurum sırası</small></div></div>' +
        (i === open ? chips : '') + '</div>';
    }).join('') + '<p class="src">Telefonu yan çevirince bütün liste ders ders tek tabloda görünür.</p></div>';
    var names = [];
    rows.forEach(function (ex) { (ex.subjects || []).forEach(function (s) { if (names.indexOf(s.name) < 0) names.push(s.name); }); });
    html += '<div class="ex-table-wrap"><table class="ex-table"><thead><tr><th rowspan="2">' + (group === 'kkt' ? 'KKT' : 'Sınav') + '</th><th rowspan="2">Tarih</th>' +
      names.map(function (n) { return '<th colspan="4" class="grp">' + esc(n) + '</th>'; }).join('') +
      '<th rowspan="2">Toplam<small>net</small></th><th rowspan="2">Sınıf<small>sıra</small></th><th rowspan="2">Kurum<small>sıra</small></th></tr><tr>' +
      names.map(function () { return '<th class="sub">D</th><th class="sub">Y</th><th class="sub">B</th><th class="sub n">Net</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.map(function (ex) {
        var by = {};
        (ex.subjects || []).forEach(function (s) { by[s.name] = s; });
        return '<tr><td class="t">' + esc(ex.title) + '</td><td class="dt">' + esc(ex.date || '') + '</td>' + names.map(function (n) {
          var s = by[n];
          if (!s || s.status === '?') return '<td class="m" colspan="4">—</td>';
          if (s.status === 'G' || s.status === 'g') return '<td class="g" colspan="4">G</td>';
          return '<td>' + esc(fmtNum(s.D)) + '</td><td>' + esc(fmtNum(s.Y)) + '</td><td>' + esc(fmtNum(s.B)) + '</td><td class="n">' + esc(fmtNum(s.Net)) + '</td>';
        }).join('') + '<td class="b">' + esc(fmtNum(ex.total)) + '</td><td class="b">' + esc(fmtNum(ex.class_rank)) + '</td><td class="b">' + esc(fmtNum(ex.inst_rank)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    return html;
  }
  function bindScoreList(card, rerender) {
    Array.prototype.forEach.call(card.querySelectorAll('[data-ex]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-ex').split(':'), key = cacheKey() + '|' + parts[0], i = Number(parts[1]);
        var cur = ui.examSel[key] == null ? 0 : Number(ui.examSel[key]);
        ui.examSel[key] = cur === i ? -1 : i;
        rerender();
      });
    });
  }

  function renderExams(d) {
    var card = $('examCard'), rows = (d.exams && d.exams.rows) || [];
    var html = '<h2>Sınav Sonuçları ' + srcBadge(d.exams && d.exams.src, d) + '</h2>';
    if (!rows.length) { card.innerHTML = html + '<div class="empty-state">Henüz yayımlanmış sınav sonucu yok.</div>'; return; }
    card.innerHTML = html + scoreListHtml(rows, 'exam');
    bindScoreList(card, function () { renderExams(d); });
  }

  // KKT sonuçlarını sınav görünümüne çevir (rapordan gelen eski satırlarda net yoksa D − Y/4).
  function kktRows(res) {
    return (res || []).map(function (q) {
      return { title: q.name, date: q.date, total: q.total, class_rank: q.class_rank, inst_rank: q.inst_rank,
        subjects: (q.subjects || []).map(function (s) {
          var net = s.Net;
          if ((net == null || net === '') && typeof s.D === 'number' && typeof s.Y === 'number') net = Math.round((s.D - s.Y / 4) * 100) / 100;
          return { name: s.label || s.course, D: s.D, Y: s.Y, B: s.B, Net: net, status: s.status };
        }) };
    });
  }

  var PART_COLOR = { odev: 'var(--c-odev)', onay: 'var(--c-onay)', feedback: 'var(--c-feedback)', guidance: 'var(--c-guidance)' };
  function gainCard(g) {
    var html = '<div class="gain"><div class="crs">' + esc(g.label || g.course) + '</div><h3>' + esc(g.main_gain) + '</h3>';
    if (g.alts && g.alts.length) html += '<p class="alts">' + g.alts.map(esc).join(' · ') + '</p>';
    if (g.advice) {
      // Misafir öğrenci: ödev/kontrol/rehberlik takibi yok; tek öneri hücresi.
      var src = (g.quizzes || []).map(function (q) { return q.name + (q.date ? ' · ' + q.date : ''); }).join(', ');
      return html + '<div class="advice">' + esc(g.advice) + '</div>' +
        (src ? '<div class="done"><em>' + esc(src) + '</em></div>' : '') + '</div>';
    }
    html += '<div class="bar">' + g.parts.map(function (p) {
      return '<i style="width:' + Math.max(0, Math.min(100, Number(p.pct) || 0)) + '%;background:' + PART_COLOR[p.k] + '"></i>';
    }).join('') + '</div>';
    html += '<div class="legend">' + g.parts.map(function (p) {
      return '<span style="--c:' + PART_COLOR[p.k] + '">' + esc(p.label) + '<b>' + Math.round(Number(p.pct) || 0) + '/' + esc(p.w) + '</b>' +
        (p.text ? '<em title="' + esc(p.text) + '">' + esc(p.text) + '</em>' : '') + '</span>';
    }).join('') + '</div>';
    var from = (g.quizzes || []).map(function (q) { return q.name + (q.date ? ' · ' + q.date : ''); }).join(', ');
    html += '<div class="done"><strong>%' + esc(g.percent) + ' tamamlandı</strong>' + (from ? '<em>' + esc(from) + '</em>' : '') + '</div>';
    if (g.tasks && g.tasks.length) {
      html += '<div class="tasks"><h4>Bu kazanım için yapılan ek çalışmalar</h4>' + g.tasks.map(function (t) {
        return '<div class="task"><span class="st ' + (t.done ? 'ok' : 'wip') + '">' + (t.done ? 'Tamam' : '%' + esc(t.percent)) + '</span>' +
          '<div>' + esc(t.title) + '<small>' + esc([t.by, t.value].filter(Boolean).join(' · ')) + '</small></div></div>';
      }).join('') + '</div>';
    }
    return html + '</div>';
  }
  function renderKkt(d) {
    var card = $('kktCard'), k = d.kkt || { results: [], deficient: [] };
    var def = k.deficient || [], res = k.results || [];
    var tab = ui.kktTab || (def.length ? 'missing' : 'results');
    var html = '<h2>KKT · Konu Kavrama Testleri ' + srcBadge(k.src, d) + '</h2>' +
      '<div class="tabs" role="tablist"><button type="button" data-tab="results" class="' + (tab === 'results' ? 'on' : '') + '">Sonuçlar</button>' +
      '<button type="button" data-tab="missing" class="' + (tab === 'missing' ? 'on' : '') + '">Eksik Kazanımlar (' + def.length + ')</button></div>';
    if (tab === 'missing') {
      html += def.length ? def.map(gainCard).join('') : '<div class="empty-state">Takip edilen eksik kazanım yok.</div>';
      if (def.length && !(d.student && d.student.guest)) {
        var rd = reportDate(d);
        html += '<p class="src">' + (k.src === 'live'
          ? 'Ödev, Kontrol ve Rehberlik anlık · Aylar Sonra ' + (rd ? 'son rapordan (' + esc(rd) + ')' : 'henüz raporda yok')
          : 'Bütün bileşenler son rapordan' + (rd ? ' (' + esc(rd) + ')' : '')) + '</p>';
      }
    } else {
      html += res.length ? scoreListHtml(kktRows(res), 'kkt') : '<div class="empty-state">Henüz KKT sonucu yok.</div>';
    }
    card.innerHTML = html;
    bindScoreList(card, function () { renderKkt(d); });
    Array.prototype.forEach.call(card.querySelectorAll('[data-tab]'), function (b) {
      b.addEventListener('click', function () { ui.kktTab = b.getAttribute('data-tab'); renderKkt(d); });
    });
  }

  function mark(v) { return v ? '<span class="mark y">' + esc(v) + '</span>' : '<span class="mark n">—</span>'; }
  function renderGeneral(d) {
    var card = $('generalCard');
    // Misafir öğrenci: güncel konu, ödev ve öğretmen çalışması bölümü yok.
    card.hidden = !!(d.student && d.student.guest);
    if (card.hidden) { card.innerHTML = ''; return; }
    var g = d.general || { topics: [], homework: [], activities: [] };
    var html = '<h2>Genel Bilgiler ' + srcBadge(g.src, d) + '</h2>';
    html += '<div class="sec">GÜNCEL İŞLENEN KONULAR</div>';
    html += (g.topics || []).length ? '<div class="list">' + g.topics.map(function (t) {
      return '<div class="it"><div>' + esc(t.label) + '<small>' + esc(t.teacher || '') + '</small></div>' +
        '<div style="text-align:right">' + esc(t.topic) + '<small>' + esc(t.date || '') + '</small></div></div>';
    }).join('') + '</div>' : '<p class="muted sm">Güncel konu girilmemiş.</p>';
    html += '<div class="sec">DERS DERS ÖDEV · KONTROL · EK GÖREV</div>';
    html += (g.homework || []).length ? g.homework.map(function (c, i) {
      var b = '<div class="hw"><span class="h">Konu</span><span class="h">Ödev</span><span class="h">Kontrol</span>' +
        (c.rows || []).map(function (r) {
          return '<span' + (r.current ? ' class="cur"' : '') + '>' + esc(r.topic) + '</span>' + mark(r.h) + mark(r.ok);
        }).join('') + '</div>';
      var plain = (c.tasks || []).filter(function (t) { return t.kind !== 'guidance'; });
      var study = (c.tasks || []).filter(function (t) { return t.kind === 'guidance'; });
      if (plain.length) {
        b += '<div class="sec" style="margin-top:10px">EK GÖREVLER</div><div class="hw">' + plain.map(function (t) {
          return '<span>' + esc(t.title) + '</span>' + mark(t.h) + mark(t.ok);
        }).join('') + '</div>';
      }
      if (study.length) {
        // Rehberliğin KKT sonucuna göre açtığı ek çalışma: Ödev = katıldı, Kontrol = değerlendirme.
        b += '<div class="sec" style="margin-top:10px">REHBERLİK EK ÇALIŞMALARI</div><div class="hw">' +
          '<span class="h">Konu</span><span class="h">Katıldı</span><span class="h">Değerlendirme</span>' + study.map(function (t) {
          return '<span>' + esc(String(t.title || '').replace(/^Rehberlik ek çalışma · /, '')) + '</span>' + mark(t.h) + mark(t.ok);
        }).join('') + '</div>';
      }
      var sum = c.topic_count + ' konu · ' + c.homework_count + ' ödev' + ((c.tasks || []).length ? ' · ' + c.tasks.length + ' ek görev' : '');
      return '<details class="acc"' + (i === 0 ? ' open' : '') + '><summary>' + esc(c.label) + ' <span class="muted sm">' + esc(sum) + '</span></summary><div class="body">' + b + '</div></details>';
    }).join('') : '<p class="muted sm">Henüz ödev veya kontrol işareti yok.</p>';
    html += '<div class="sec">ÖĞRETMEN–ÖĞRENCİ ÇALIŞMASI</div>';
    var acts = g.activities || [], shown = ui.actMore ? acts : acts.slice(0, 8);
    html += acts.length ? '<div class="list">' + shown.map(function (a) {
      return '<div class="it"><div>' + esc(a.text) + '<small>' + esc([a.label, a.teacher].filter(Boolean).join(' · ')) + '</small></div><small>' + esc(a.date || '') + '</small></div>';
    }).join('') + '</div>' + (acts.length > shown.length ? '<button type="button" class="secondary" id="btnActMore">Tümünü göster (' + acts.length + ')</button>' : '')
      : '<p class="muted sm">Henüz öğretmen çalışması girilmemiş.</p>';
    card.innerHTML = html;
    if ($('btnActMore')) $('btnActMore').addEventListener('click', function () { ui.actMore = true; renderGeneral(d); });
  }

  // ───────────────────────── veri alma ─────────────────────────
  var syncing = false, lastSync = 0;
  async function syncLive(force, manual) {
    var no = studentKey(state.activeNo), code = state.parentCode, session = sessionVersion;
    if (syncing || !state.sessionToken || !no) return;
    if (!force && !manual && Date.now() - lastSync < 15000) return;
    syncing = true;
    if ($('btnRefresh')) $('btnRefresh').classList.add('spin');
    try {
      var d = await api({ action: 'parent_live', student_no: no, parent_code: code, force: !!manual });
      lastSync = Date.now();
      if (session !== sessionVersion || code !== state.parentCode || no !== studentKey(state.activeNo)) return;
      validateIdentity(d, no);
      var key = cacheKey(), before = state.liveCache[key];
      state.liveCache[key] = d;
      writeState();
      renderLive();
      if (manual) log('Bilgiler yenilendi.', true);
      else if (before && before.generated_at !== d.generated_at && changedVisible(before, d)) log('Yeni bilgi var — sayfa güncellendi.', true);
    } catch (e) {
      if (manual || !state.liveCache[cacheKey()]) {
        log(e.message || String(e), false);
        if (!state.liveCache[cacheKey()] && studentKey(state.activeNo) === no) {
          ['examCard', 'kktCard', 'generalCard'].forEach(function (id) {
            if ($(id)) $(id).innerHTML = '<div class="empty-state"><strong>Gösterilemedi</strong>' + esc(e.message || String(e)) + '</div>';
          });
        }
      }
    } finally {
      syncing = false;
      if ($('btnRefresh')) $('btnRefresh').classList.remove('spin');
    }
  }
  function changedVisible(a, b) {
    function strip(x) { return JSON.stringify([x.late, x.exams, x.kkt, x.general]); }
    return strip(a) !== strip(b);
  }

  // ───────────────────────── giriş / çıkış ─────────────────────────
  async function doLogin() {
    var code = String(($('parentCode') && $('parentCode').value) || '').trim().toUpperCase();
    var phone = String(($('parentPhone') && $('parentPhone').value) || '').trim();
    if (!code) { log('Erişim kodunu girin.', false); return; }
    if (phone.replace(/\D/g, '').length < 10) { log('Kurumda kayıtlı telefon numaranızı girin.', false); return; }
    clearState();
    showLogin();
    state.parentCode = code;
    var loginVersion = sessionVersion;
    log('Giriş kontrol ediliyor…');
    try {
      var d = await api({ action: 'parent_login', parent_code: code, phone: phone });
      if (loginVersion !== sessionVersion || state.parentCode !== code) return;
      state.sessionToken = d.session_token || '';
      if ($('parentPhone')) $('parentPhone').value = '';
      state.parentLabel = d.parent_label || 'Veli';
      state.isAdmin = !!d.is_admin;
      state.adminRole = d.admin_role || '';
      state.students = d.students || [];
      state.activeNo = state.isAdmin ? '' : (state.students.length ? String(state.students[0].no) : '');
      writeState();
      showSession();
      log('Giriş başarılı.', true);
      syncLive(true);
    } catch (e) {
      if (loginVersion !== sessionVersion) return;
      clearState();
      showLogin();
      log(e.message || String(e), false);
    }
  }
  // Kayıtlı oturumu telefon sormadan, cihaza bağlı anahtarla sessizce yeniler.
  async function doResume() {
    var version = sessionVersion;
    var d = await api({ action: 'parent_session', parent_code: state.parentCode });
    if (version !== sessionVersion) return;
    state.parentLabel = d.parent_label || state.parentLabel;
    state.students = d.students || state.students;
    state.isAdmin = !!d.is_admin;
    state.adminRole = d.admin_role || '';
    if (!state.students.some(function (s) { return String(s.no) === String(state.activeNo); })) {
      state.activeNo = (state.isAdmin || !state.students.length) ? '' : String(state.students[0].no);
    }
    writeState();
    showSession();
  }
  function doLogout() {
    clearState();
    if ($('parentCode')) $('parentCode').value = '';
    showLogin();
    log('Çıkış yapıldı.', true);
  }

  $('btnParentLogin').addEventListener('click', function () { doLogin().catch(function (e) { log(e.message || String(e), false); }); });
  ['parentCode', 'parentPhone'].forEach(function (id) {
    if (!$(id)) return;
    $(id).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); doLogin().catch(function (err) { log(err.message || String(err), false); }); }
    });
  });
  $('btnParentLogout').addEventListener('click', doLogout);
  $('studentSwitch').addEventListener('click', function (e) {
    if (state.isAdmin) return;
    var b = e.target.closest ? e.target.closest('[data-no]') : null;
    if (b) selectStudent(b.getAttribute('data-no'));
  });
  // Yatay tutuş: CSS medya sorgusuna ek olarak sınıf (bazı uygulama içi tarayıcılar sorguyu geç uygular).
  function applyOrientation() {
    var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;
    document.body.classList.toggle('land', w > h && w >= 480);
  }
  window.addEventListener('resize', applyOrientation);
  window.addEventListener('orientationchange', function () { setTimeout(applyOrientation, 150); });
  applyOrientation();
  // Açıkken düzenli, öne gelince ve ağ dönünce sessizce yenile.
  setInterval(function () { if (!document.hidden) syncLive(false); }, 90000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) syncLive(false); });
  window.addEventListener('online', function () { syncLive(true); });
  window.addEventListener('focus', function () { syncLive(false); });

  readState();
  // WhatsApp bağlantısı kodu adres parçasında taşır (#k=KOD); sunucuya gitmez.
  var linkCode = '';
  try {
    var m = /[#&]k=([A-Za-z0-9]{4,16})/.exec(window.location.hash || '');
    if (m) { linkCode = m[1].toUpperCase(); history.replaceState(null, '', window.location.pathname + window.location.search); }
  } catch (ignore) {}
  if (linkCode && linkCode !== state.parentCode) {
    clearState();
    if ($('parentCode')) $('parentCode').value = linkCode;
    showLogin();
    if ($('parentPhone')) $('parentPhone').focus();
    return;
  }
  if (state.parentCode && state.students && state.students.length) {
    if ($('parentCode')) $('parentCode').value = state.parentCode;
    showSession();
    doResume().then(function () { return syncLive(true); }).catch(function (e) {
      log('Çevrimdışı: ' + (e.message || 'ağ yok') + ' — kayıtlı bilgiler gösteriliyor.', true);
    });
  } else {
    showLogin();
    if (state.parentCode && $('parentCode')) $('parentCode').value = state.parentCode;
  }
})();
</script>

<style>
#vzGuard{position:fixed;left:0;right:0;bottom:0;z-index:2147483000;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;font:600 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}

#vzGuard.warn .vz-box{border-top-color:#c0392b}

#vzGuard .vz-2{background:#eef4f8;color:#174e78}
</style>
<div id="vzGuard" role="status" aria-live="polite"><div class="vz-box"><strong></strong><p></p><div class="vz-row"></div></div></div>
<script>
(function(){
  'use strict';
  var APP=document.documentElement.getAttribute('data-vz-app')||'VizyonEdu';
  var box=document.getElementById('vzGuard');if(!box)return;
  var ua=navigator.userAgent||'';
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  function show(kind,title,text,buttons){
    box.className=kind;box.querySelector('strong').textContent=title;box.querySelector('p').textContent=text;
    var row=box.querySelector('.vz-row');row.innerHTML='';
    buttons.forEach(function(b){var el=document.createElement(b.href?'a':'button');el.textContent=b.label;if(b.href)el.href=b.href;if(b.second)el.className='vz-2';
      el.addEventListener('click',function(e){if(b.fn){e.preventDefault();b.fn();}});row.appendChild(el);});
    box.style.display='block';
  }
  function hide(){box.style.display='none';}
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  // Uygulama içi tarayıcılar: WhatsApp, Facebook, Instagram, Android WebView («wv»).
  var inApp=/WhatsApp|FBAN|FBAV|Instagram|Line\/|; wv\)/i.test(ua);
  var android=/Android/i.test(ua);
  var hint=null;
  if(inApp){
    var b=[];
    if(android){b.push({label:'Chrome\'da aç',href:'intent://'+location.host+location.pathname+location.search+'#Intent;scheme=https;package=com.android.chrome;end'});}
    b.push({label:'Daha sonra',second:true,fn:hide});
    hint=['warn','Uygulama içinde açtınız',
      'Bu sayfa WhatsApp gibi bir uygulamanın içinde açıldı. Kayıtlarınızın ve girişinizin kaybolmaması için sayfayı '+(android?'Chrome':'Safari')+'\'da açın ve «Ana ekrana ekle» deyin; sonra hep o simgeden girin.',b];
  }else if(!standalone && !store('vz-home-hint-ok')){
    hint=['','Ana ekrana ekleyin',
      (/iPhone|iPad/i.test(ua)?'Paylaş ⬆︎ → «Ana Ekrana Ekle»':'Tarayıcı menüsü ⋮ → «Ana ekrana ekle»')+'. '+APP+' hep aynı simgeden açılırsa girişiniz ve bekleyen kayıtlarınız korunur.',
      [{label:'Tamam',fn:function(){store('vz-home-hint-ok','1');hide();}}]];
  }
  if(hint)show(hint[0],hint[1],hint[2],hint[3]);
  // Yeni sürüm: sayfanın yayındaki kopyası farklı bir yapı kimliği taşıyorsa yenile şeridi.
  var meta=document.querySelector('meta[name="vz-build"]'),mine=meta?meta.content:'',last=0;
  function check(){
    if(!mine||Date.now()-last<10*60*1000)return;last=Date.now();
    fetch(location.pathname+'?vzc='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
      var m=/<meta name="vz-build" content="([^"]+)"/.exec(t||'');
      if(m&&m[1]!==mine)show('','Yeni sürüm var',APP+' güncellendi. Yenilemek için dokunun.',[
        {label:'Yenile',fn:function(){location.replace(location.pathname+'?v='+m[1]);}},{label:'Sonra',second:true,fn:hide}]);
    }).catch(function(){});
  }
  check();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
})();
</script>
